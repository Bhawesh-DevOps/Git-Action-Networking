
name: Terraform Azure VM Deploy

on: 
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps: 
      - name: Checkout code
        uses: action/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
           client-id: ${{ secrets.AZURE_CLIENT_ID }}
           tenant-id: ${{ secrets.AZURE_TENANT_ID }}
           subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3  
      - name: Terraform Init
        run: terraform init
      - name: plan
        run: terraform plan
      - name: apply
        run: terraform apply-auto-approve      
    
      
    
